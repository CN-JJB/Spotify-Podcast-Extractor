<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify-Podcast-Extractor</title>
  <link rel="stylesheet" href="export.css">
</head>
<body>
  <header class="masthead"><img class="brand-icon" src="icons/icon48.png" width="36" height="36" alt=""><span data-i18n="brand">Spotify-Podcast-Extractor</span><nav><a href="https://github.com/CN-JJB/Spotify-Podcast-Extractor" target="_blank" rel="noreferrer">GitHub ↗</a><a href="help.html" target="_blank" data-i18n="help">使用帮助</a><a href="privacy.html" target="_blank" data-i18n="privacyLink">隐私说明</a><select id="language" aria-label="Language / 界面语言"><option value="zh">中文</option><option value="en">English</option></select></nav><span class="local" data-i18n="local">在本机处理</span></header>
  <main>
    <section class="intro"><p class="eyebrow" data-i18n="eyebrow">从聆听到笔记</p><h1 id="title" data-i18n="readingTitle">正在读取转录原文…</h1><p id="podcast" class="muted" data-i18n="readingSubtitle">读取完毕后，可以核对全文并选择下载格式。</p></section>
    <div id="status" role="status" aria-live="polite">正在检查转录面板与末尾内容，请稍候。</div>
    <div class="workspace">
      <aside class="card controls">
        <h2 data-i18n="exportTitle">导出文件</h2>
        <label class="field" for="format" data-i18n="format">文件格式</label>
        <select id="format"><option value="md" data-i18n="mdOption">Markdown · Obsidian (.md)</option><option value="txt" data-i18n="txtOption">纯文本 (.txt)</option><option value="html" data-i18n="htmlOption">离线阅读网页 (.html)</option><option value="json" data-i18n="jsonOption">原始数据 (.json)</option><option value="csv" data-i18n="csvOption">逐句表格 (.csv)</option></select>
        <fieldset id="options"><legend data-i18n="layout">文字排版</legend><label><input type="checkbox" id="speakers" checked><span data-i18n="speakers">保留说话人</span></label><label><input type="checkbox" id="metadata" checked><span data-i18n="metadata">附标题、节目与来源链接</span></label><label><input type="checkbox" id="sentenceLines"><span data-i18n="sentenceLines">每句单独分段</span></label></fieldset>
        <p id="formatHint" class="hint">带 Obsidian 属性的 Markdown，可直接放进你的笔记仓库。</p>
        <button id="download" class="primary" disabled>下载 Markdown</button>
        <label class="save-option"><input id="saveAs" type="checkbox" checked><span data-i18n="saveAs">下载时选择保存位置</span></label>
        <p id="downloadStatus" role="status" aria-live="polite" class="hint"></p>
        <button id="retry" class="secondary" disabled data-i18n="retry">重新提取</button>
        <p class="privacy" data-i18n="privacySummary">仅在你点击时读取本集标题、链接与转录，用于在本机生成下载文件。内容不会上传。</p>
      </aside>
      <section class="card transcript-card" aria-label="转录核对">
        <div class="card-heading"><h2 data-i18n="checkTitle">全文核对</h2><a id="source" hidden target="_blank" rel="noreferrer" data-i18n="source">打开原单集 ↗</a></div>
        <div class="stats"><div><strong id="sentences">—</strong><span data-i18n="sentences">字幕句数</span></div><div><strong id="characters">—</strong><span data-i18n="characters">正文字符</span></div><div><strong id="speakerCount">—</strong><span data-i18n="speakerCount">已标记说话人</span></div></div>
        <div class="boundaries"><p><b data-i18n="first">首句</b><span id="first">—</span></p><p><b data-i18n="last">末句</b><span id="last">—</span></p></div>
        <details id="previewDetails"><summary data-i18n="preview">查看全部正文</summary><div id="preview"></div></details>
        <p class="footnote" data-i18n="footnote">保留原始措辞与重复句。</p>
      </section>
    </div>
    <footer class="product-footer"><p data-i18n="timestamps"></p><p data-i18n="affiliation"></p></footer>
  </main>
  <script type="module" src="export.js"></script>
</body>
</html>
